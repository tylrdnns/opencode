name: Build OpenCode Fork

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Build linux-x64 binary with embedded web UI
        run: |
          cd packages/opencode
          bun run build -- --single
        env:
          OPENCODE_CHANNEL: latest
          OPENCODE_VERSION: "1.0.0"

      - name: Package binary
        run: |
          cd packages/opencode/dist/opencode-linux-x64/bin
          tar czf /tmp/opencode-linux-x64.tar.gz opencode

      - name: Create/Update release
        run: |
          # Create release if it doesn't exist, then upload/overwrite the asset
          gh release create latest \
            --title "Latest Build" \
            --notes "Automated build from dev branch" \
            --prerelease 2>/dev/null || true

          gh release upload latest \
            /tmp/opencode-linux-x64.tar.gz \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
