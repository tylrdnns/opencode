name: Build OpenCode Fork

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Build binary with embedded web UI
        run: |
          cd packages/opencode
          bun run build -- --skip-install
        env:
          NODE_ENV: production

      - name: Package linux-x64 binary
        run: |
          cd packages/opencode/dist/opencode-linux-x64/bin
          tar czf /tmp/opencode-linux-x64.tar.gz opencode

      - name: Create/Update release
        run: |
          # Delete existing 'latest' release if it exists
          gh release delete latest --yes 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

          # Create new release
          gh release create latest \
            /tmp/opencode-linux-x64.tar.gz \
            --title "Latest Build" \
            --notes "Automated build from dev branch" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
